<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      Strict Content Security Policy:
      - default-src 'self': Only allow assets from this origin by default.
      - object-src 'none': Disable plugins like Flash to reduce attack surface.
      - base-uri 'none': Prevent base tag hijacking.
      - script/style/img/connect-src: Explicitly allow necessary resources.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self' ws://localhost:* http://localhost:*; object-src 'none'; base-uri 'none';"
    />
    <!-- Prevent leaking data via the Referer header -->
    <meta name="referrer" content="no-referrer" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Geometry Dash Clone</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="ui">
      <h1>Geometry Dash Clone</h1>
      <div id="level-select">
        <button data-level="stereo-madness" aria-label="Play Stereo Madness - Easy difficulty">Stereo Madness (Easy)</button>
        <button data-level="cant-let-go" aria-label="Play Can't Let Go - Hard difficulty">Can't Let Go (Hard)</button>
        <button data-level="deadlocked" aria-label="Play Deadlocked - Demon difficulty">Deadlocked (Demon)</button>
      </div>
      <div id="controls">
        <h3>Controls</h3>
        <p>Space / Up Arrow: Jump</p>
        <p>Esc: Back to Menu</p>
      </div>
    </div>
    <canvas id="gameCanvas" class="hidden"></canvas>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
