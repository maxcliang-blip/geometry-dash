<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      Content Security Policy:
      - default-src 'self': Only allow content from our own domain by default.
      - script-src 'self': Only allow scripts from our own domain.
      - style-src 'self': Only allow styles from our own domain.
      - img-src 'self' data:: Allow images from our domain and data URIs (e.g. base64).
      - connect-src 'self' ws://localhost:* http://localhost:*: Allow connections to our domain and localhost (for dev).
      - object-src 'none': Disallow plugins like Flash.
      - base-uri 'self': Restrict the URLs that can be used in the <base> tag.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self' ws://localhost:* http://localhost:*; object-src 'none'; base-uri 'self';"
    />
    <!--
      Referrer-Policy:
      - no-referrer: The Referer header will be omitted entirely. No referrer information is sent along with requests.
    -->
    <meta name="referrer" content="no-referrer" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Geometry Dash Clone</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="ui">
      <h1>Geometry Dash Clone</h1>
      <div id="level-select">
        <button data-level="stereo-madness" aria-label="Play Stereo Madness - Easy difficulty">Stereo Madness (Easy)</button>
        <button data-level="cant-let-go" aria-label="Play Can't Let Go - Hard difficulty">Can't Let Go (Hard)</button>
        <button data-level="deadlocked" aria-label="Play Deadlocked - Demon difficulty">Deadlocked (Demon)</button>
      </div>
      <div id="controls">
        <h3>Controls</h3>
        <p>Space / Up Arrow: Jump</p>
        <p>Esc: Back to Menu</p>
      </div>
    </div>
    <canvas id="gameCanvas" class="hidden"></canvas>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
