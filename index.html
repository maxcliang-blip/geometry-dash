<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Geometry Dash Clone</title>
    <style>
      body {
        margin: 0;
        overflow: hidden;
        background-color: #222;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        color: white;
        font-family: sans-serif;
      }
      canvas {
        border: 2px solid white;
        background-color: #000;
        display: none;
      }
      #ui {
        position: absolute;
        top: 0;
        left: 0;
        padding: 20px;
        background: rgba(0, 0, 0, 0.7);
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        box-sizing: border-box;
      }
      #level-select {
        display: flex;
        gap: 10px;
        margin-bottom: 30px;
      }
      button {
        padding: 10px 20px;
        font-size: 16px;
        cursor: pointer;
        background: #444;
        color: white;
        border: 2px solid white;
        border-radius: 4px;
        transition: background 0.2s, transform 0.1s;
      }
      button:hover {
        background: #666;
        transform: scale(1.05);
      }
      button:focus-visible {
        outline: 3px solid #00ffff;
        outline-offset: 2px;
      }
      #controls-hint {
        font-size: 14px;
        color: #ccc;
        text-align: center;
      }
      .key {
        background: #555;
        padding: 2px 6px;
        border-radius: 3px;
        color: #fff;
        font-family: monospace;
      }
    </style>
  </head>
  <body>
    <div id="ui">
      <h1>Geometry Dash Clone</h1>
      <div id="level-select">
        <button data-level="stereo-madness" aria-label="Play Stereo Madness - Difficulty: Easy">Stereo Madness (Easy)</button>
        <button data-level="cant-let-go" aria-label="Play Can't Let Go - Difficulty: Hard">Can't Let Go (Hard)</button>
        <button data-level="deadlocked" aria-label="Play Deadlocked - Difficulty: Demon">Deadlocked (Demon)</button>
      </div>
      <div id="controls-hint">
        <p>Press <span class="key">Space</span> or <span class="key">↑</span> to Jump</p>
        <p>Press <span class="key">Esc</span> to return to Menu</p>
      </div>
    </div>
    <canvas id="gameCanvas"></canvas>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
