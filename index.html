<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Content Security Policy:
         - default-src 'self': Only allow content from our own origin by default
         - script-src 'self': Only allow scripts from our own origin (no inline scripts)
         - style-src 'self': Only allow styles from our own origin (no inline styles)
         - img-src 'self' data:: Allow images from our origin and data URIs (for small icons/placeholders)
         - connect-src 'self' ws://localhost:* http://localhost:*: Allow API/WebSocket connections to self and local dev server
         - object-src 'none': Prevent loading of plugins like Flash or Java
         - base-uri 'self': Restrict the URLs which can be used in a document's <base> element
         - form-action 'none': Prevent form submissions to keep this a pure client-side app
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self' ws://localhost:* http://localhost:*; object-src 'none'; base-uri 'self'; form-action 'none';"
    />
    <!-- Referrer-Policy: Do not send referrer information to protect user privacy and prevent leakage of internal URL structures -->
    <meta name="referrer" content="no-referrer" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Geometry Dash Clone</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="ui">
      <h1>Geometry Dash Clone</h1>
      <div id="level-select">
        <button data-level="stereo-madness" aria-label="Play Stereo Madness - Easy difficulty">Stereo Madness (Easy)</button>
        <button data-level="cant-let-go" aria-label="Play Can't Let Go - Hard difficulty">Can't Let Go (Hard)</button>
        <button data-level="deadlocked" aria-label="Play Deadlocked - Demon difficulty">Deadlocked (Demon)</button>
      </div>
      <div id="controls">
        <h3>Controls</h3>
        <p>Space / Up Arrow: Jump</p>
        <p>Esc: Back to Menu</p>
      </div>
    </div>
    <canvas id="gameCanvas" class="hidden"></canvas>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
