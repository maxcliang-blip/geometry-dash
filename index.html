<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Geometry Dash Clone</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="ui">
      <h1>Geometry Dash Clone</h1>
      <div id="level-select">
        <button onclick="startGame('stereo-madness')">Stereo Madness (Easy)</button>
        <button onclick="startGame('cant-let-go')">Can't Let Go (Hard)</button>
        <button onclick="startGame('deadlocked')">Deadlocked (Demon)</button>
      </div>
      <div class="controls-hint">
        <h3>Controls</h3>
        <ul>
          <li><strong>Space</strong> or <strong>Up Arrow</strong>: Jump</li>
          <li><strong>Escape</strong>: Return to Menu</li>
        </ul>
      </div>
    </div>
    <canvas id="gameCanvas" class="hidden"></canvas>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
