<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Geometry Dash Clone</title>
    <style>
      body {
        margin: 0;
        overflow: hidden;
        background-color: #222;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        color: white;
        font-family: sans-serif;
      }
      canvas {
        border: 2px solid white;
        background-color: #000;
      }
      #ui {
        position: absolute;
        top: 0;
        left: 0;
        padding: 20px;
      }
      #level-select {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
      }
      button {
        padding: 10px 20px;
        font-size: 16px;
        cursor: pointer;
        background-color: #444;
        color: white;
        border: 2px solid #666;
        border-radius: 4px;
        transition: all 0.2s ease;
      }
      button:hover {
        background-color: #666;
        border-color: #fff;
        transform: translateY(-2px);
      }
      button:focus-visible {
        outline: none;
        box-shadow: 0 0 0 3px #00ffff;
        border-color: #00ffff;
      }
      button:active {
        transform: translateY(0);
      }
    </style>
  </head>
  <body>
    <div id="ui">
      <h1>Geometry Dash Clone</h1>
      <div id="level-select">
        <button data-level="stereo-madness" aria-label="Play Stereo Madness - Easy difficulty">
          Stereo Madness (Easy)
        </button>
        <button data-level="cant-let-go" aria-label="Play Can't Let Go - Hard difficulty">
          Can't Let Go (Hard)
        </button>
        <button data-level="deadlocked" aria-label="Play Deadlocked - Demon difficulty">
          Deadlocked (Demon)
        </button>
      </div>
    </div>
    <canvas id="gameCanvas"></canvas>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
